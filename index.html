<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Memory</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="ocean"></div>
<div class="bubbles"></div>

<div class="login-box">

    <h1>🌊 Ocean Memory</h1>

    <p>Every wave keeps a memory.</p>

    <input
        id="username"
        type="text"
        placeholder="Username">

    <input
        id="password"
        type="password"
        placeholder="Password">

    <button onclick="login()">

        Dive Into Memories

    </button>

    <span id="error"></span>

</div>

<script src="js/login.js"></script>

</body>
</html>
